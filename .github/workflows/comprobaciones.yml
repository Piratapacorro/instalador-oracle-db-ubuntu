name: Comprobaciones

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de bash
        run: bash -n oracle-db.sh

      - name: ShellCheck
        run: shellcheck --severity=warning oracle-db.sh tests/zenity-falso tests/prueba-gui.sh

      - name: Interfaz gráfica simulada (zenity falso)
        run: tests/prueba-gui.sh

      - name: Ayuda y versión
        run: |
          ./oracle-db.sh --version
          ./oracle-db.sh ayuda

      - name: Diagnóstico (no cambia nada)
        run: ./oracle-db.sh comprobar
